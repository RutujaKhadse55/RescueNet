services:
  - type: web
    name: rescuenet-api
    env: docker
    dockerfilePath: services/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rescuenet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: rescuenet-db
    databaseName: rescuenet
    user: rescuenet
    plan: free
    postgresMajorVersion: 16
