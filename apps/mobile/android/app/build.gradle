apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def monorepoRoot = rootDir.parentFile.parentFile.parentFile
def mobileDir = rootDir.parentFile

def nativeModulesGradleFile = file("${mobileDir}/node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
if (!nativeModulesGradleFile.exists()) {
    nativeModulesGradleFile = file("${monorepoRoot}/node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
}
if (!nativeModulesGradleFile.exists()) {
    def pnpmMatch = fileTree(dir: "${monorepoRoot}/node_modules/.pnpm", include: "**/@react-native-community/cli-platform-android/native_modules.gradle").files
    if (!pnpmMatch.isEmpty()) {
        nativeModulesGradleFile = pnpmMatch.iterator().next()
    }
}
apply from: nativeModulesGradleFile
applyNativeModulesAppBuildGradle(project)

react {
    /* Folders */
    //   root = file("../..")
    //   reactNativeDir = file("../../node_modules/react-native")
    //   jsEngine = "hermes"
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdkVersion 35

    namespace "org.rescuenet.app"
    defaultConfig {
        applicationId "org.rescuenet.app"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('RESCUENET_RELEASE_STORE_FILE')) {
                storeFile file(RESCUENET_RELEASE_STORE_FILE)
                storePassword RESCUENET_RELEASE_STORE_PASSWORD
                keyAlias RESCUENET_RELEASE_KEY_ALIAS
                keyPassword RESCUENET_RELEASE_KEY_PASSWORD
            }
        }
    }

    flavorDimensions "distribution"
    productFlavors {
        sideload {
            dimension "distribution"
            applicationIdSuffix ".sideload"
            versionNameSuffix "-sideload"
        }
        play {
            dimension "distribution"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (project.hasProperty('RESCUENET_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
