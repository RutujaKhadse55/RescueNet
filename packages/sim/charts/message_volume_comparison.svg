<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0F172A" />
  
  <!-- Title -->
  <text x="40" y="45" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">
    Total Transmissions: Full RescueNet vs Plain Flooding (1,000 Nodes)
  </text>
  <text x="40" y="70" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">
    Measured over 30 seeds with 95% confidence intervals. Evaluates spatial clustering, Spray-and-Wait, and priority queues.
  </text>

  <!-- Baseline Axis -->
  <line x1="60" y1="360" x2="760" y2="360" stroke="#334155" stroke-width="1.5" />

  
        <!-- Bar: Plain Flooding -->
        <rect x="100" y="102.2181755708437" width="120" height="257.7818244291563" rx="6" fill="#EF4444" opacity="0.9" />
        <text x="160" y="90.2181755708437" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
          48,457,259
        </text>
        <!-- Error Bar -->
        <line x1="160" y1="100.00000000000001" x2="160" y2="104.43635114168738" stroke="#FFFFFF" stroke-width="2" />
        <line x1="152" y1="100.00000000000001" x2="168" y2="100.00000000000001" stroke="#FFFFFF" stroke-width="2" />
        <line x1="152" y1="104.43635114168738" x2="168" y2="104.43635114168738" stroke="#FFFFFF" stroke-width="2" />
        <!-- X Axis Label -->
        <text x="160" y="385" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
          Plain Flooding
        </text>
      
        <!-- Bar: Epidemic TTL=5 -->
        <rect x="270" y="285.4879776533866" width="120" height="74.51202234661336" rx="6" fill="#F59E0B" opacity="0.9" />
        <text x="330" y="273.4879776533866" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
          14,006,606
        </text>
        <!-- Error Bar -->
        <line x1="330" y1="284.47347053434834" x2="330" y2="286.5024847724249" stroke="#FFFFFF" stroke-width="2" />
        <line x1="322" y1="284.47347053434834" x2="338" y2="284.47347053434834" stroke="#FFFFFF" stroke-width="2" />
        <line x1="322" y1="286.5024847724249" x2="338" y2="286.5024847724249" stroke="#FFFFFF" stroke-width="2" />
        <!-- X Axis Label -->
        <text x="330" y="385" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
          Epidemic TTL=5
        </text>
      
        <!-- Bar: Spray & Wait -->
        <rect x="440" y="359.95812021280733" width="120" height="0.041879787192654075" rx="6" fill="#3B82F6" opacity="0.9" />
        <text x="500" y="347.95812021280733" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
          7,872
        </text>
        <!-- Error Bar -->
        <line x1="500" y1="359.9571173815887" x2="500" y2="359.95912304402594" stroke="#FFFFFF" stroke-width="2" />
        <line x1="492" y1="359.9571173815887" x2="508" y2="359.9571173815887" stroke="#FFFFFF" stroke-width="2" />
        <line x1="492" y1="359.95912304402594" x2="508" y2="359.95912304402594" stroke="#FFFFFF" stroke-width="2" />
        <!-- X Axis Label -->
        <text x="500" y="385" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
          Spray & Wait
        </text>
      
        <!-- Bar: RescueNet Full -->
        <rect x="610" y="359.8307608608331" width="120" height="0.16923913916691238" rx="6" fill="#10B981" opacity="0.9" />
        <text x="670" y="347.8307608608331" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
          31,813
        </text>
        <!-- Error Bar -->
        <line x1="670" y1="359.825201161578" x2="670" y2="359.8363205600882" stroke="#FFFFFF" stroke-width="2" />
        <line x1="662" y1="359.825201161578" x2="678" y2="359.825201161578" stroke="#FFFFFF" stroke-width="2" />
        <line x1="662" y1="359.8363205600882" x2="678" y2="359.8363205600882" stroke="#FFFFFF" stroke-width="2" />
        <!-- X Axis Label -->
        <text x="670" y="385" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
          RescueNet Full
        </text>
      
