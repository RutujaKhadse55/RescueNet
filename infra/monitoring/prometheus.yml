global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "rescuenet-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:3000"]
        labels:
          service: "rescuenet-api"
          tier: "backend"

  - job_name: "pgbouncer"
    static_configs:
      - targets: ["pgbouncer:9127"]
        labels:
          service: "pgbouncer"
          tier: "database"
